<!-- Feature Area Analysis — 2-column popup body (Settings | Results) -->
<div class="bas-body">
  <div class="rf-section-row bas-section-row">

    <!-- Left: settings column -->
    <div class="rf-settings-col">

      <div class="data-input-group" data-input-group="selection">
        <div class="rf-section-title">Features to analyze</div>
        <div class="rf-feature-select-actions">
          <a href="#" id="basFeatureSelectAll">Select all</a>&nbsp;<span class="u-muted">|</span>&nbsp;<a href="#" id="basFeatureSelectNone">Clear</a>
        </div>
        <div id="basFeatureChecklist" class="rf-feature-checklist">
          <div class="rf-empty-note">No features drawn.</div>
        </div>

      </div>

      <div class="data-input-group" data-input-group="geography">
        <div class="rf-section-title form-section">Geography</div>

      <div class="form-field">
        <label class="tiny">Level</label>
        <select id="basGeoLevel" class="rf-select">
          <option value="tract">Census Tracts</option>
          <option value="bg" selected>Block Groups</option>
        </select>
      </div>

      <div class="form-field">
        <label class="tiny">ACS Year</label>
        <select id="basYearSelect" class="rf-select">
          <option value="2024">2024 ACS 5-year</option>
          <option value="2023">2023 ACS 5-year</option>
          <option value="2022">2022 ACS 5-year</option>
          <option value="2021">2021 ACS 5-year</option>
        </select>
      </div>

      </div>

      <div class="data-input-group" data-input-group="analysis">
        <div class="rf-section-title form-section">Analysis parameters</div>
        <label class="tiny">Buffer distance (mi)</label>
        <input type="number" id="basBufferMiles" class="rf-number-input" value="0.5" min="0.05" max="5" step="0.05">
        <label class="tpi-toggle-row u-mt-2">
          <input type="checkbox" id="basUseDisplayBuffers">
          <span class="tiny">Use Display Buffers</span>
        </label>
        <label class="tpi-toggle-row u-mt-3">
          <input type="checkbox" id="basApportionByArea" checked>
          <span class="tiny">Apportion by area</span>
        </label>
      </div>

      <div class="data-input-group" data-input-group="variables">
        <div class="rf-section-title form-section">Variables</div>
        <div class="rf-feature-select-actions">
          <button type="button" id="varSelectAll" class="var-action-btn">Select all</button>
          <span class="u-muted">|</span>
          <button type="button" id="varClearAll" class="var-action-btn">Clear all</button>
        </div>
        <!-- Populated at runtime by buffer-summary.js init() from VAR_META in utils.js. -->
        <fieldset id="varSelect" class="bas-var-checklist"></fieldset>
      </div>

      <div class="module-input-actions">
        <button id="basRun" type="button" class="rf-action-primary">
          Calculate Summary
        </button>
      </div>

    </div>

    <!-- Right: results column -->
    <div class="rf-results-col">

      <div id="basStatus" class="rf-status" style="display:none;"></div>

      <div id="basResultsProgress" class="results-progress"></div>

      <div id="basMapRow" class="form-field" style="display:none;">
        <label class="tiny">Map by geography</label>
        <select id="basMapVar" class="rf-select"></select>
        <label class="tpi-toggle-row u-mt-2">
          <input type="checkbox" id="basHideChoropleth">
          <span class="tiny">Hide choropleth</span>
        </label>
      </div>

      <table id="basResultsTable" class="results-table" style="display:none;">
        <thead>
          <tr>
            <th>Census Category</th>
            <th>Variable</th>
            <th>Result</th>
            <th>Percent</th>
            <th>Aggregation Method</th>
          </tr>
        </thead>
        <tbody id="basResultsTbody"></tbody>
      </table>

      <div id="basResultsNotes" class="results-notes"></div>

    </div>

  </div>
</div>
