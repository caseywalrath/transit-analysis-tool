<!-- projects/gtfs-popup.html
     GTFS Feed Viewer popup body.
     Two-column layout: left = file directory, right = CSV table view. -->

<div class="gtfs-popup-layout">
  <div class="gtfs-ptabs" role="tablist"><button type="button" class="gtfs-ptab active" data-tab="overview" role="tab" aria-selected="true">Overview</button><button type="button" class="gtfs-ptab" data-tab="files" role="tab" aria-selected="false">Files</button></div>

  <div id="gtfsOverview" class="gtfs-overview gtfs-ptab-pane" data-tab="overview">
    <div id="gtfsOverviewEmpty" class="gtfs-empty-state">No GTFS feed loaded.<br>Use Add Data&nbsp;(+) &rarr; GTFS to load a feed.</div>
    <div id="gtfsOverviewBody"></div>

    <div id="gtfsDateControls" class="gtfs-date-controls" style="display:none;">
      <div class="rf-section-title">Day to analyze</div>
      <input type="date" id="gtfsAnalysisDate" class="rf-select" aria-label="Day to analyze">
      <div id="gtfsAnalysisDateDesc" class="gtfs-date-desc"></div>
      <div id="gtfsAnalysisDateRange" class="gtfs-date-range"></div>
    </div>

    <div id="gtfsDayParts" class="gtfs-dayparts" style="display:none;">
      <div class="rf-section-title">Parts of the day</div>
      <div id="gtfsDayPartsRows"></div>
      <div class="btn-row"><button type="button" id="gtfsDayPartsReset" class="rf-btn-sm">Reset to standard</button></div>
      <div id="gtfsDayPartsMsg" class="gtfs-date-desc"></div>
    </div>
    <div id="gtfsHealth" hidden></div>
  </div>

  <div class="gtfs-ptab-pane" data-tab="files" hidden>
  <div class="rf-section-row">

    <!-- Left: file directory + map controls -->
    <div class="rf-settings-col">

      <div class="rf-section-title">Feed Files</div>
      <div id="gtfsFileList" class="gtfs-file-list">
        <div class="gtfs-empty-state">No GTFS feed loaded.<br>Use Add Data&nbsp;(+) &rarr; GTFS to load a feed.</div>
      </div>

      <div id="gtfsMapControls" class="gtfs-map-controls" style="display:none;">
        <div class="rf-section-title">Map Layers</div>
        <label class="var-check">
          <input type="checkbox" id="gtfsShowRoutes" checked> Show routes
        </label>
        <label class="var-check">
          <input type="checkbox" id="gtfsShowStops" checked> Show stops
        </label>
        <button id="gtfsClearBtn" class="rf-action-secondary gtfs-clear-btn">
          Clear GTFS Feed
        </button>
      </div>

    </div>

    <!-- Right: CSV table view -->
    <div class="rf-results-col">

      <div id="gtfsTableTitle" class="rf-section-title" style="display:none; font-family:monospace;"></div>

      <div id="gtfsTableWrapper" class="gtfs-table-wrapper" style="display:none;">
        <table class="gtfs-table">
          <thead id="gtfsTableHead"></thead>
          <tbody id="gtfsTableBody"></tbody>
        </table>
      </div>

      <div id="gtfsTableMeta" class="gtfs-table-meta" style="display:none;"></div>

      <div id="gtfsSelectPrompt" class="gtfs-empty-state">
        Select a file from the list to view its contents.
      </div>

    </div>

  </div>
  </div>
</div>
