<div class="ds-root">
  <div class="ds-grid">
    <div class="ds-corner"></div>
    <div class="ds-col-hdr">Points</div>
    <div class="ds-col-hdr">Lines</div>
    <div class="ds-col-hdr">Routes</div>
    <div class="ds-col-hdr">Polygons</div>
    <div class="ds-col-hdr">Buffers</div>

    <div class="ds-row-hdr">Opacity</div>
    <div class="ds-cell"><div class="ds-cell-control" id="ds-pointOpacity"></div></div>
    <div class="ds-cell"><div class="ds-cell-control" id="ds-lineOpacity"></div></div>
    <div class="ds-cell"><div class="ds-cell-control" id="ds-routeOpacity"></div></div>
    <div class="ds-cell"><div class="ds-cell-control" id="ds-polygonOpacity"></div></div>
    <div class="ds-cell"><div class="ds-cell-control" id="ds-bufferOpacity"></div></div>

    <div class="ds-row-hdr">Size / Width</div>
    <div class="ds-cell"><div class="ds-cell-control" id="ds-pointLineWidth"></div></div>
    <div class="ds-cell"><div class="ds-cell-control" id="ds-lineLineWidth"></div></div>
    <div class="ds-cell"><div class="ds-cell-control" id="ds-routeLineWidth"></div></div>
    <div class="ds-cell"><div class="ds-cell-control" id="ds-polygonLineWidth"></div></div>
    <div class="ds-cell"><div class="ds-cell-control" id="ds-bufferLineWidth"></div></div>
  </div>

  <div class="ds-footer">
    <button id="ds-reset-all" class="ds-reset-btn" type="button">Reset All to Defaults</button>
  </div>
</div>
