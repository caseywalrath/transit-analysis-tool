<div class="ds-root">
  <div class="ds-grid">
    <div class="ds-corner"></div>
    <div class="ds-col-hdr">Points</div>
    <div class="ds-col-hdr">Lines</div>
    <div class="ds-col-hdr">Routes</div>
    <div class="ds-col-hdr">Polygons</div>
    <div class="ds-col-hdr">Buffers</div>

    <div class="ds-row-hdr">Opacity</div>
    <div class="ds-cell"><input type="range" id="ds-pointOpacity" /><span class="ds-val"></span></div>
    <div class="ds-cell"><input type="range" id="ds-lineOpacity" /><span class="ds-val"></span></div>
    <div class="ds-cell"><input type="range" id="ds-routeOpacity" /><span class="ds-val"></span></div>
    <div class="ds-cell"><input type="range" id="ds-polygonOpacity" /><span class="ds-val"></span></div>
    <div class="ds-cell"><input type="range" id="ds-bufferOpacity" /><span class="ds-val"></span></div>

    <div class="ds-row-hdr">Size / Width</div>
    <div class="ds-cell"><input type="range" id="ds-pointLineWidth" /><span class="ds-val"></span></div>
    <div class="ds-cell"><input type="range" id="ds-lineLineWidth" /><span class="ds-val"></span></div>
    <div class="ds-cell"><input type="range" id="ds-routeLineWidth" /><span class="ds-val"></span></div>
    <div class="ds-cell"><input type="range" id="ds-polygonLineWidth" /><span class="ds-val"></span></div>
    <div class="ds-cell"><input type="range" id="ds-bufferLineWidth" /><span class="ds-val"></span></div>
  </div>

  <div class="ds-footer">
    <button id="ds-reset-all" class="ds-reset-btn" type="button">Reset All to Defaults</button>
  </div>
</div>
