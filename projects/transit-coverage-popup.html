<!-- Transit Coverage — 2-column popup body (Settings | Results) -->
<div class="cs-body tc-body">
  <div class="rf-section-row tc-section-row">

    <!-- Left: settings column -->
    <div class="rf-settings-col">

      <div class="data-input-group" data-input-group="transit-selection">

      <div class="rf-section-title">Transit routes/lines</div>
      <div class="rf-feature-select-actions">
        <a href="#" id="tcFeatSelectAll">Select all</a>&nbsp;<span class="u-muted">|</span>&nbsp;<a href="#" id="tcFeatSelectNone">Clear</a>
      </div>
      <div id="tcFeatureList" class="rf-feature-checklist">
        <div class="rf-empty-note">No routes or lines drawn.</div>
      </div>

      </div>

      <div class="data-input-group" data-input-group="area-selection">

      <div class="rf-section-title form-section">Service area (drawn polygons)</div>
      <div class="rf-feature-select-actions">
        <a href="#" id="tcAreaSelectAll">Select all</a>&nbsp;<span class="u-muted">|</span>&nbsp;<a href="#" id="tcAreaSelectNone">Clear</a>
      </div>
      <div id="tcAreaList" class="rf-feature-checklist">
        <div class="rf-empty-note">No polygons drawn.</div>
      </div>

      </div>

      <div class="data-input-group" data-input-group="geography">

      <div class="rf-section-title form-section">Geography</div>

      <div class="form-field">
        <label class="tiny">Level</label>
        <select id="tcGeoLevel" class="rf-select">
          <option value="tract">Census Tracts</option>
          <option value="bg" selected>Block Groups</option>
        </select>
      </div>

      <div class="form-field">
      <label class="tiny">
        ACS Year&nbsp;<button id="tcLodesWarnBtn" class="rf-info-btn" type="button"
          aria-label="LODES data warning"
          title="LODES data not loaded — Jobs columns will show — until a LODES file is loaded via Add Data."
          style="color:#f59e0b;display:none;">&#9888;</button>
      </label>
      <select id="tcYearSelect" class="rf-select">
        <option value="2024">2024</option>
        <option value="2023">2023</option>
        <option value="2022">2022</option>
        <option value="2021">2021</option>
      </select>
      </div>

      </div>

      <div class="data-input-group" data-input-group="analysis">

      <div class="rf-section-title form-section">Coverage settings</div>

      <div class="form-field">
        <label class="tiny">Buffer distance (mi)</label>
        <input type="number" id="tcBufferMiles" class="rf-number-input" value="0.5" min="0.05" max="5" step="0.05">
        <label class="tpi-toggle-row u-mt-2">
          <input type="checkbox" id="tcUseDisplayBuffers">
          <span class="tiny">Use Display Buffers</span>
        </label>
      </div>

      <div class="form-field">
        <label class="tiny">Day type (peak headway)</label>
        <select id="tcDayType" class="rf-select">
          <option value="weekday" selected>Weekday</option>
          <option value="saturday">Saturday</option>
          <option value="sunday">Sunday</option>
        </select>
      </div>

      <div class="form-field">
        <label class="tiny">Headway threshold (min)</label>
        <input type="number" id="tcHeadwayThreshold" class="rf-number-input" min="1" step="1" placeholder="none">
      </div>

      </div>

      <div class="module-input-actions">
        <button id="tcRunBtn" type="button" class="rf-action-primary">
          Analyze Coverage
        </button>
      </div>

    </div>

    <!-- Right: results column (flex:1) -->
    <div class="rf-results-col">

      <div id="tcStatus" class="rf-status" style="display:none;">
        <span id="tcStatusText">Ready</span>
      </div>

      <!-- Results (shown after a successful run) -->
      <div id="tcResults" style="display:none;">
        <div id="tcResultsTable"></div>

        <p id="tcStatSentence" class="tiny u-mt-2"></p>
        <div id="tcHeadwayList" class="u-mt-3"></div>

        <!-- Export buttons -->
        <div class="btn-row">
          <button id="tcExportGeoJSON" type="button" class="rf-btn-sm" disabled>Export GeoJSON</button>
          <button id="tcExportCSV" type="button" class="rf-btn-sm" disabled>Export CSV</button>
        </div>

        <p class="tiny u-mt-2 u-muted">
          Population is apportioned by area; jobs are counted by whole LODES block (apportionment does not apply to jobs).
          <span id="tcHiddenNote"></span>
        </p>
      </div>

    </div>

  </div>
</div>
